<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Login · Patinhas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="phone">
  <div style="height:100%; display:flex; flex-direction:column; background:white;">
    <div class="statusbar" style="color:var(--text-1);">
      <span class="time">9:41</span>
      <div class="icons">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="4" width="3" height="8" rx="1"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1"/><rect x="9" y="0.5" width="3" height="11.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".3"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="21" height="10" rx="3" stroke="currentColor" stroke-width="1" fill="none" opacity=".35"/><rect x="1.5" y="2.5" width="15" height="7" rx="2"/><path d="M22 4.5v3a1.5 1.5 0 000-3z" opacity=".4"/></svg>
      </div>
    </div>

    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; padding:28px 28px;" class="anim-fade-up">

      <!-- Logo -->
      <div style="text-align:center; margin-bottom:28px;">
        <div style="width:76px;height:76px;background:var(--primary);border-radius:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 8px 24px rgba(255,90,95,0.35);font-size:36px;animation:pulse 2s infinite;">🐾</div>
        <h1 style="font-size:28px;font-weight:800;color:var(--text-1);letter-spacing:-0.8px;">Patinhas</h1>
        <p style="color:var(--text-2);font-size:14px;margin-top:4px;">Conectando corações e patinhas</p>
      </div>

      <!-- Caixa de Feedback da API (Carregamento / Sucesso / Erro) -->
      <div id="login-feedback" style="display:none; padding:12px 14px; border-radius:12px; font-size:13px; font-weight:600; margin-bottom:16px; line-height:1.4;"></div>

      <!-- Inputs -->
      <div class="input-group">
        <label>E-mail</label>
        <div class="input-wrap">
          <span class="input-icon">✉️</span>
          <input type="email" id="email" placeholder="lucas@ifrn.edu.br" value="lucas@ifrn.edu.br">
        </div>
      </div>
      <div class="input-group">
        <label>Senha</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="senha" placeholder="••••••••" value="123456">
        </div>
      </div>
      <p style="text-align:right;margin:-10px 0 18px;font-size:13px;color:var(--primary);font-weight:600;cursor:pointer;" onclick="preencherDemoOng()">Entrar como ONG (Demo)</p>

      <button id="btn-login" class="btn btn-primary" onclick="fazerLogin()">Entrar</button>

      <div class="divider">ou</div>

      <button class="btn btn-ghost" onclick="window.location.href='02-cadastro-tipo.html'">
        ✨ &nbsp;Criar Nova Conta
      </button>

      <p style="text-align:center;color:var(--text-2);font-size:13px;margin-top:20px;">
        Não tem conta? <a href="02-cadastro-tipo.html" style="color:var(--primary);font-weight:700;">Cadastre-se</a>
      </p>
    </div>
    <p style="text-align:center;color:var(--text-3);font-size:11px;padding-bottom:16px;line-height:1.6;">
      ONG: <b>admin@ong.com</b> (senha: admin)<br>
      Admin: <b>admin@patinhas.org.br</b> (senha: admin123)<br>
      Adotante: <b>lucas@ifrn.edu.br</b> (senha: 123456)
    </p>
  </div>
</div>

<script src="db.js"></script>
<script>
function showFeedback(type, text) {
  const box = document.getElementById('login-feedback');
  box.style.display = 'block';
  if (type === 'loading') {
    box.style.background = '#EFF6FF';
    box.style.color = '#1D4ED8';
    box.style.border = '1px solid #BFDBFE';
  } else if (type === 'error') {
    box.style.background = '#FEF2F2';
    box.style.color = '#DC2626';
    box.style.border = '1px solid #FECACA';
  } else if (type === 'success') {
    box.style.background = '#ECFDF5';
    box.style.color = '#047857';
    box.style.border = '1px solid #A7F3D0';
  }
  box.textContent = text;
}

function preencherDemoOng() {
  document.getElementById('email').value = 'admin@ong.com';
  document.getElementById('senha').value = 'admin';
  showFeedback('loading', 'Credenciais da ONG preenchidas. Clique em Entrar.');
}

async function fazerLogin() {
  const email = (document.getElementById('email').value || '').trim();
  const senha = (document.getElementById('senha').value || '').trim();
  const btn = document.getElementById('btn-login');

  if (!email || !senha) {
    showFeedback('error', '⚠️ Informe seu e-mail e sua senha para autenticar.');
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ Autenticando no servidor...';
  showFeedback('loading', '⏳ Validando credenciais junto à API REST (POST /api/auth/login)...');

  try {
    // 1. Tenta autenticar no servidor próprio Node.js + SQLite
    const res = await PatinhasAPI.login(email, senha);
    showFeedback('success', `✅ Bem-vindo(a), ${res.usuario.nome}! Redirecionando...`);
    btn.textContent = '✅ Autenticado!';

    setTimeout(() => {
      if (res.usuario.perfil === 'ong') {
        window.location.href = '15-painel-ong.html';
      } else {
        window.location.href = '05-home-swipe.html';
      }
    }, 450);
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Entrar';
    if (err.status === 400 || err.status === 401 || err.status === 403 || err.status === 429) {
      showFeedback('error', `⚠️ ${err.message || 'Credenciais inválidas.'}`);
    } else {
      showFeedback('error', '⚠️ Não foi possível conectar ao servidor API REST. Certifique-se de que o backend está em execução.');
    }
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });
</script>
</body>
</html>
