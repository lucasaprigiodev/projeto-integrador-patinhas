<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patinhas - Painel ONG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .brand-color { color: #FF5A5F; }
        .brand-bg { background-color: #FF5A5F; }
        .brand-hover:hover { background-color: #E04448; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col hidden md:flex">
        <div class="h-16 flex items-center px-6 border-b border-gray-200">
            <span class="text-2xl mr-2">🐾</span>
            <span class="text-xl font-extrabold text-gray-800 tracking-tight">Patinhas <span class="brand-color">ONG</span></span>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-red-50 brand-color rounded-xl font-semibold">Dashboard</a>
        </nav>
        <div class="p-4 border-t border-gray-200"><p class="text-sm font-semibold">ONG Patinhas</p></div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shrink-0">
            <h1 class="text-xl font-bold text-gray-800">Painel de Adoções</h1>
            <button onclick="openPetModal()" class="brand-bg brand-hover text-white px-4 py-2 rounded-lg font-semibold text-sm shadow-sm">+ Adicionar Animal</button>
        </header>

        <div class="flex-1 overflow-auto p-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100"><p class="text-sm text-gray-500">Pets Ativos</p><p class="text-3xl font-bold" id="stat-pets">-</p></div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100"><p class="text-sm text-gray-500">Candidatos Pendentes</p><p class="text-3xl font-bold" id="stat-cand">-</p></div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100"><p class="text-sm text-gray-500">Adoções Concluídas</p><p class="text-3xl font-bold" id="stat-adop">-</p></div>
            </div>

            <!-- ANIMAIS CADASTRADOS -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-8">
                <div class="px-6 py-5 border-b border-gray-100"><h2 class="text-lg font-bold">Nossos Animais (App)</h2></div>
                <div class="p-6 grid grid-cols-2 md:grid-cols-4 gap-4" id="pets-grid">
                    <p class="text-gray-500">Carregando...</p>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-8">
                <div class="px-6 py-5 border-b border-gray-100 flex justify-between"><h2 class="text-lg font-bold">Candidatos</h2><span class="text-sm text-green-500 font-bold">● Ao Vivo</span></div>
                <table class="w-full text-left border-collapse">
                    <thead><tr class="bg-gray-50 text-gray-500 text-xs uppercase"><th class="px-6 py-4">Adotante</th><th class="px-6 py-4">Pet Desejado</th><th class="px-6 py-4">Status</th><th class="px-6 py-4 text-right">Ações</th></tr></thead>
                    <tbody id="table-body" class="divide-y divide-gray-100 text-sm"></tbody>
                </table>
            </div>
        </div>

        <!-- NOVO PET MODAL -->
        <div id="pet-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
            <div class="bg-white rounded-2xl p-8 w-full max-w-md shadow-2xl">
                <h2 class="text-2xl font-bold mb-6">Cadastrar Animal</h2>
                <form onsubmit="event.preventDefault(); savePet();" class="space-y-4">
                    <div><label class="block text-sm font-semibold mb-1">Nome</label><input required id="p-name" class="w-full border rounded-lg p-2" placeholder="Ex: Rex"></div>
                    <div><label class="block text-sm font-semibold mb-1">Idade</label><input required id="p-age" class="w-full border rounded-lg p-2" placeholder="Ex: 2 anos"></div>
                    <div><label class="block text-sm font-semibold mb-1">Raça / Tipo</label><input required id="p-breed" class="w-full border rounded-lg p-2" placeholder="Ex: SRD"></div>
                    <div><label class="block text-sm font-semibold mb-1">URL da Foto (Link da Imagem)</label><input required id="p-img" class="w-full border rounded-lg p-2" placeholder="https://..."></div>
                    <div class="flex justify-end gap-2 pt-4">
                        <button type="button" onclick="closePetModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">Cancelar</button>
                        <button type="submit" class="brand-bg text-white px-6 py-2 rounded-lg font-bold">Publicar no App</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- CHAT MODAL -->
        <div id="chat-modal" class="fixed inset-0 bg-black bg-opacity-40 z-50 flex justify-end opacity-0 pointer-events-none transition-opacity duration-300">
            <div id="chat-panel" class="w-full max-w-md bg-white h-full shadow-2xl flex flex-col transform translate-x-full transition-transform duration-300">
                <div class="px-6 py-4 border-b border-gray-200 flex justify-between brand-bg text-white">
                    <div><h3 class="font-bold" id="chat-title">Chat</h3><p class="text-xs" id="chat-subtitle">Online</p></div>
                    <button onclick="closeChat()" class="text-2xl">&times;</button>
                </div>
                <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50"></div>
                <div class="p-4 bg-white border-t border-gray-200">
                    <form onsubmit="event.preventDefault(); sendMsg();" class="flex gap-2">
                        <input id="chat-input" class="flex-1 border rounded-full px-4" placeholder="Mensagem...">
                        <button type="submit" class="brand-bg text-white rounded-full w-10 h-10 flex items-center justify-center">➤</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

<script>
const DB_URL = "https://crudcrud.com/api/9b1e3dcbe2b94e8ca1b5092bb17ec113/db/6ab87a98693e4d03e87e0b35";
let currentMatchId = null;
let chatInterval = null;

async function fetchDashboard() {
    try {
        const res = await fetch(DB_URL);
        const json = await res.json();
        const pets = json.pets;
        const matches = json.matches;
        
        const pendentes = matches.filter(m => m.status === 'pendente');
        const aprovados = matches.filter(m => m.status === 'aprovado');
        
        document.getElementById('stat-pets').innerText = pets.length;
        document.getElementById('stat-cand').innerText = pendentes.length;
        document.getElementById('stat-adop').innerText = aprovados.length;
        
        // RENDER PETS
        const pGrid = document.getElementById('pets-grid');
        pGrid.innerHTML = '';
        pets.forEach(p => {
            pGrid.innerHTML += `<div class="rounded-xl border border-gray-200 overflow-hidden"><img src="${p.img}" class="w-full h-32 object-cover"><div class="p-3"><h4 class="font-bold text-sm">${p.name}</h4><p class="text-xs text-gray-500">${p.breed}</p></div></div>`;
        });

        // RENDER MATCHES
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';
        if(pendentes.length === 0) tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8">Nenhum candidato aguardando.</td></tr>`;
        pendentes.forEach(m => {
            tbody.innerHTML += `<tr>
                <td class="px-6 py-4 font-bold">${m.userName}</td>
                <td class="px-6 py-4 flex items-center gap-2"><img src="${m.petImg}" class="w-8 h-8 rounded object-cover">${m.petName}</td>
                <td class="px-6 py-4"><span class="px-3 py-1 text-xs rounded-full bg-yellow-100 text-yellow-800">Pendente</span></td>
                <td class="px-6 py-4 text-right">
                    <button onclick="openChat('${m.id}', '${m.userName}')" class="bg-gray-100 p-2 rounded">💬</button>
                    <button onclick="setStatus('${m.id}', 'aprovado')" class="bg-green-100 text-green-700 font-bold p-2 rounded">Aprovar</button>
                    <button onclick="setStatus('${m.id}', 'rejeitado')" class="bg-red-100 text-red-700 font-bold p-2 rounded">Rejeitar</button>
                </td>
            </tr>`;
        });
    } catch(e) {}
}

async function savePet() {
    const n=document.getElementById('p-name').value;
    const a=document.getElementById('p-age').value;
    const b=document.getElementById('p-breed').value;
    const i=document.getElementById('p-img').value;
    try {
        const res = await fetch(DB_URL);
        const json = await res.json();
        json.pets.push({ id: Date.now(), name: n, age: a, breed: b, img: i, ong: "ONG Patinhas", dist: "0km", status: "disponivel" });
        delete json._id; await fetch(DB_URL, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(json) });
        closePetModal();
        fetchDashboard();
        alert("Pet cadastrado com sucesso! Ele já vai aparecer no aplicativo de todos os usuários.");
    } catch(e) {}
}

async function setStatus(matchId, status) {
    try {
        const res = await fetch(DB_URL);
        const json = await res.json();
        const m = json.matches.find(x => x.id == matchId);
        if(m) m.status = status;
        delete json._id; await fetch(DB_URL, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(json) });
        fetchDashboard();
    } catch(e) {}
}

function openPetModal() { document.getElementById('pet-modal').classList.remove('hidden'); }
function closePetModal() { document.getElementById('pet-modal').classList.add('hidden'); }

// Chat
function openChat(matchId, userName) {
    currentMatchId = matchId;
    document.getElementById('chat-title').innerText = "Chat com " + userName;
    document.getElementById('chat-modal').classList.remove('opacity-0', 'pointer-events-none');
    document.getElementById('chat-panel').classList.remove('translate-x-full');
    loadChat();
    chatInterval = setInterval(loadChat, 2000);
}
function closeChat() {
    document.getElementById('chat-modal').classList.add('opacity-0', 'pointer-events-none');
    document.getElementById('chat-panel').classList.add('translate-x-full');
    currentMatchId = null;
    clearInterval(chatInterval);
}
async function loadChat() {
    if(!currentMatchId) return;
    try {
        const res = await fetch(DB_URL);
        const json = await res.json();
        const chats = json.chats.filter(c => c.matchId == currentMatchId);
        const area = document.getElementById('chat-messages');
        area.innerHTML = '';
        chats.forEach(c => {
            const isMe = c.sender === 'ong';
            area.innerHTML += `<div class="flex ${isMe?'justify-end':'justify-start'}"><div class="max-w-[75%] rounded-xl px-4 py-2 text-sm ${isMe?'brand-bg text-white':'bg-white border text-gray-800'}">${c.text}</div></div>`;
        });
        area.scrollTop = area.scrollHeight;
    } catch(e) {}
}
async function sendMsg() {
    const text = document.getElementById('chat-input').value.trim();
    if(!text || !currentMatchId) return;
    document.getElementById('chat-input').value = '';
    try {
        const res = await fetch(DB_URL);
        const json = await res.json();
        json.chats.push({ matchId: currentMatchId, sender: 'ong', text });
        delete json._id; await fetch(DB_URL, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(json) });
        loadChat();
    } catch(e) {}
}

fetchDashboard();
setInterval(fetchDashboard, 5000);
</script></body></html>
