<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Cadastrar Pet · Patinhas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="phone">
  <div class="statusbar" style="color:var(--text-1);">
    <span class="time">9:41</span>
    <div class="icons">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="4" width="3" height="8" rx="1"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1"/><rect x="9" y="0.5" width="3" height="11.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".3"/></svg>
      <svg width="15" height="12" viewBox="0 0 15 12" fill="currentColor"><path d="M7.5 2.5C9.8 2.5 11.8 3.5 13.2 5L14.5 3.7C12.8 1.9 10.3 0.8 7.5 0.8S2.2 1.9 0.5 3.7L1.8 5C3.2 3.5 5.2 2.5 7.5 2.5Z" opacity=".3"/><path d="M7.5 5.2C9.0 5.2 10.4 5.9 11.4 7L12.7 5.7C11.4 4.3 9.6 3.5 7.5 3.5S3.6 4.3 2.3 5.7L3.6 7C4.6 5.9 6.0 5.2 7.5 5.2Z" opacity=".6"/><circle cx="7.5" cy="10" r="2"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="21" height="10" rx="3" stroke="currentColor" stroke-width="1" fill="none" opacity=".35"/><rect x="1.5" y="2.5" width="15" height="7" rx="2"/><path d="M22 4.5v3a1.5 1.5 0 000-3z" opacity=".4"/></svg>
    </div>
  </div>
  <div style="padding:0 20px 14px;display:flex;align-items:center;gap:12px;">
    <a href="javascript:history.back()" style="display:flex;align-items:center;color:var(--text-1);text-decoration:none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
    </a>
    <h1 style="font-size:18px;font-weight:800;">Cadastrar Novo Pet</h1>
  </div>

  <div class="scroll-content" style="padding:0 20px 20px;">
    <!-- Seleção de Foto Rápida ou URL -->
    <label style="font-size:12px;font-weight:700;color:var(--text-2);display:block;margin-bottom:8px;">ESCOLHA UMA FOTO OU INSIRA A URL</label>
    <div style="display:flex;gap:10px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;">
      <img onclick="selectPresetPhoto('https://images.unsplash.com/photo-1537151625747-768eb6cf92b2?w=800&q=80', this)" src="https://images.unsplash.com/photo-1537151625747-768eb6cf92b2?w=300&q=80" style="width:76px;height:76px;border-radius:14px;object-fit:cover;cursor:pointer;border:3px solid var(--primary);flex-shrink:0;" class="preset-photo">
      <img onclick="selectPresetPhoto('https://images.unsplash.com/photo-1517849845537-4d257902454a?w=800&q=80', this)" src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=300&q=80" style="width:76px;height:76px;border-radius:14px;object-fit:cover;cursor:pointer;border:3px solid transparent;flex-shrink:0;" class="preset-photo">
      <img onclick="selectPresetPhoto('https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=800&q=80', this)" src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=300&q=80" style="width:76px;height:76px;border-radius:14px;object-fit:cover;cursor:pointer;border:3px solid transparent;flex-shrink:0;" class="preset-photo">
      <img onclick="selectPresetPhoto('https://images.unsplash.com/photo-1548199973-03cce0bbc87b?w=800&q=80', this)" src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b?w=300&q=80" style="width:76px;height:76px;border-radius:14px;object-fit:cover;cursor:pointer;border:3px solid transparent;flex-shrink:0;" class="preset-photo">
    </div>

    <div class="input-group">
      <label>Nome do Pet</label>
      <div class="input-wrap"><span class="input-icon">🐾</span><input type="text" id="pet-nome" placeholder="Ex: Pipoca"></div>
    </div>
    <div style="display:flex;gap:10px;">
      <div class="input-group" style="flex:1;">
        <label>Espécie</label>
        <div class="input-wrap"><span class="input-icon">🐶</span>
          <select id="pet-especie">
            <option value="Cachorro">Cachorro</option>
            <option value="Gato">Gato</option>
            <option value="Outro">Outro</option>
          </select>
        </div>
      </div>
      <div class="input-group" style="flex:1;">
        <label>Sexo</label>
        <div class="input-wrap"><span class="input-icon">⚥</span>
          <select id="pet-sexo"><option value="Macho">Macho</option><option value="Fêmea">Fêmea</option></select>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:10px;">
      <div class="input-group" style="flex:1;">
        <label>Porte</label>
        <div class="input-wrap"><span class="input-icon">📏</span>
          <select id="pet-porte"><option value="Pequeno">Pequeno</option><option value="Médio" selected>Médio</option><option value="Grande">Grande</option></select>
        </div>
      </div>
      <div class="input-group" style="flex:1;">
        <label>Idade</label>
        <div class="input-wrap"><span class="input-icon">📅</span>
          <input type="text" id="pet-idade" placeholder="Ex: 1 ano" value="1 ano">
        </div>
      </div>
    </div>
    <div class="input-group">
      <label>Raça</label>
      <div class="input-wrap"><span class="input-icon">🔬</span><input type="text" id="pet-raca" placeholder="SRD (vira-lata) ou raça específica" value="SRD"></div>
    </div>
    <div class="input-group">
      <label>Sobre o Pet e Histórico de Saúde</label>
      <textarea id="pet-desc" rows="3" placeholder="Conte um pouco sobre a personalidade e história do pet..." style="width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:13.5px;font-family:'Inter',sans-serif;resize:none;box-sizing:border-box;">Resgatado com muito amor em Natal/RN, já está vacinado, castrado, vermifugado e pronto para adoção responsável!</textarea>
    </div>

    <!-- Dados do Resgate & Prontuário Inicial -->
    <div style="background:var(--surface-2);border-radius:14px;padding:14px;margin-bottom:16px;border:1px solid var(--border);">
      <h3 style="font-size:13px;font-weight:800;color:var(--text-1);margin-bottom:10px;">🚨 Dados do Resgate & Triagem Inicial</h3>
      <div style="display:flex;gap:10px;margin-bottom:10px;">
        <div class="input-group" style="flex:1;margin-bottom:0;">
          <label style="font-size:11px;">Local do Resgate</label>
          <div class="input-wrap"><input type="text" id="pet-local-resgate" placeholder="Ex: Tirol, Natal/RN" value="Natal/RN" style="font-size:12px;"></div>
        </div>
        <div class="input-group" style="flex:1;margin-bottom:0;">
          <label style="font-size:11px;">Peso Inicial (kg)</label>
          <div class="input-wrap"><input type="number" step="0.1" id="pet-peso" placeholder="Ex: 12.5" style="font-size:12px;"></div>
        </div>
      </div>
      <div class="input-group" style="margin-bottom:0;">
        <label style="font-size:11px;">Condição Inicial no Acolhimento</label>
        <div class="input-wrap"><input type="text" id="pet-condicao-inicial" placeholder="Ex: Dócil, vermifugado e sem fraturas" value="Resgatado em boas condições gerais" style="font-size:12px;"></div>
      </div>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;">
      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--surface-2);padding:7px 12px;border-radius:20px;"><input type="checkbox" id="chk-vacinado" checked style="accent-color:var(--primary);"> Vacinado</label>
      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--surface-2);padding:7px 12px;border-radius:20px;"><input type="checkbox" id="chk-castrado" checked style="accent-color:var(--primary);"> Castrado</label>
      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--surface-2);padding:7px 12px;border-radius:20px;"><input type="checkbox" id="chk-vermifugado" checked style="accent-color:var(--primary);"> Vermifugado</label>
      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--surface-2);padding:7px 12px;border-radius:20px;"><input type="checkbox" id="chk-sociavel" checked style="accent-color:var(--primary);"> Sociável</label>
    </div>

    <button id="btnPublicar" onclick="publicarPet()" class="btn btn-primary">🐾 Publicar Pet no Catálogo</button>
  </div>
</div>

<script src="db.js"></script>
<script>
let selectedPhotoUrl = 'https://images.unsplash.com/photo-1537151625747-768eb6cf92b2?w=800&q=80';

function selectPresetPhoto(url, imgEl) {
  selectedPhotoUrl = url;
  document.querySelectorAll('.preset-photo').forEach(el => {
    el.style.borderColor = 'transparent';
  });
  imgEl.style.borderColor = 'var(--primary)';
}

async function publicarPet() {
  const nome = (document.getElementById('pet-nome').value || '').trim();
  const especie = document.getElementById('pet-especie').value;
  const sexo = document.getElementById('pet-sexo').value;
  const porte = document.getElementById('pet-porte').value;
  const idade = (document.getElementById('pet-idade').value || '1 ano').trim();
  const raca = (document.getElementById('pet-raca').value || 'SRD').trim();
  const desc = (document.getElementById('pet-desc').value || '').trim();
  const localResgate = (document.getElementById('pet-local-resgate').value || 'Natal/RN').trim();
  const peso = parseFloat(document.getElementById('pet-peso').value) || null;
  const condicaoInicial = (document.getElementById('pet-condicao-inicial').value || 'Resgatado em boas condições gerais').trim();
  const vacinado = document.getElementById('chk-vacinado').checked;
  const castrado = document.getElementById('chk-castrado').checked;
  const vermifugado = document.getElementById('chk-vermifugado').checked;
  const btn = document.getElementById('btnPublicar');

  if (!nome || nome.length < 2) {
    alert('Por favor, informe o nome do pet (mínimo 2 caracteres).');
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ Gravando no servidor e prontuário...';

  try {
    const db = await loadDb();
    if (!db.pets) db.pets = [];
    const newId = db.pets.reduce((max, p) => Math.max(max, Number(p.id) || 0), 0) + 1;

    const newPet = {
      id: newId,
      name: nome,
      nome: nome,
      species: especie,
      especie: especie,
      breed: raca,
      raca: raca,
      age: idade,
      idade: idade,
      size: porte,
      porte: porte,
      gender: sexo,
      sexo: sexo,
      dist: '2km • Natal/RN',
      ong: 'ONG Patinhas Natal',
      status: 'disponivel',
      matchScore: 98,
      img: selectedPhotoUrl,
      foto_url: selectedPhotoUrl,
      about: desc,
      descricao: desc,
      local_resgate: localResgate,
      condicao_inicial: condicaoInicial,
      peso_atual_kg: peso,
      vacinado: vacinado,
      castrado: castrado,
      vermifugado: vermifugado
    };

    // Tenta registrar diretamente via API REST (se token estiver presente)
    if (window.PatinhasAPI && PatinhasAPI.getAuthToken()) {
      try {
        await PatinhasAPI.cadastrarResgate({
          nome,
          especie,
          raca,
          idade,
          porte,
          sexo,
          descricao: desc,
          foto_url: selectedPhotoUrl,
          local_resgate: localResgate,
          condicao_inicial: condicaoInicial,
          peso_atual_kg: peso,
          castrado: castrado ? 1 : 0,
          vacinado: vacinado ? 1 : 0,
          vermifugado: vermifugado ? 1 : 0,
          status: 'disponivel'
        });
      } catch (_) {}
    }

    db.pets.unshift(newPet);
    await saveDb(db);

    const isONG = localStorage.getItem('isONG') === 'true';
    window.location.href = isONG ? '15-painel-ong.html' : '14-meus-anuncios.html';
  } catch (e) {
    console.error(e);
    btn.disabled = false;
    btn.textContent = '🐾 Publicar Pet no Catálogo';
  }
}
</script>
</body>
</html>
