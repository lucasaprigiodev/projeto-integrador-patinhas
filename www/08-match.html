<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Match! · Patinhas</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    @keyframes heartBeat {
      0% { transform: translateX(-50%) scale(1); }
      14% { transform: translateX(-50%) scale(1.25); }
      28% { transform: translateX(-50%) scale(1); }
      42% { transform: translateX(-50%) scale(1.25); }
      70% { transform: translateX(-50%) scale(1); }
    }
    @keyframes pulseRing {
      0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.2; }
      50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.4; }
      100% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.2; }
    }
    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(850px) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:var(--primary);overflow:hidden;">

<div class="phone" style="background-color:var(--primary);position:relative;height:100vh;max-height:100vh;overflow:hidden;">
  <div id="confetti" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:100;"></div>
  
  <div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:32px 24px;position:relative;overflow:hidden;box-sizing:border-box;">

    <!-- Círculos decorativos de fundo -->
    <div style="position:absolute;width:340px;height:340px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.15);top:46%;left:50%;transform:translate(-50%,-50%);animation:pulseRing 4s infinite ease-in-out;pointer-events:none;"></div>
    <div style="position:absolute;width:220px;height:220px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.22);top:46%;left:50%;transform:translate(-50%,-50%);animation:pulseRing 4s infinite 0.7s ease-in-out;pointer-events:none;"></div>

    <div id="matchContent" style="opacity:0;transform:scale(0.8);transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1);position:relative;z-index:10;width:100%;max-width:340px;">
      
      <p style="color:rgba(255,255,255,0.85);font-size:14px;font-weight:800;margin:0 0 6px 0;letter-spacing:3px;text-transform:uppercase;">É UM</p>
      <h1 style="font-size:48px;font-weight:900;color:white;letter-spacing:-2px;margin:0 0 8px 0;line-height:1;">MATCH! 🎉</h1>
      <p id="matchSubText" style="color:rgba(255,255,255,0.95);font-size:16px;font-weight:700;margin:0 0 8px 0;">Você e seu pet se conectaram!</p>
      
      <!-- Detalhes do Pet em Badge -->
      <div id="matchPetTag" style="display:inline-block;padding:5px 14px;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.35);border-radius:20px;color:white;font-size:12px;font-weight:700;margin-bottom:34px;backdrop-filter:blur(6px);">
        Adoção Responsável 🐾
      </div>

      <!-- Fotos com Círculos Cruzados e Fallback Seguro -->
      <div style="display:flex;justify-content:center;align-items:center;margin-bottom:44px;position:relative;">
        <!-- Avatar do Pet -->
        <div style="width:116px;height:116px;border-radius:50%;border:4px solid white;box-shadow:0 12px 28px rgba(0,0,0,0.25);overflow:hidden;background:#FF8C5A;z-index:2;position:relative;flex-shrink:0;">
          <img id="matchPetImg" 
               src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=400&q=80" 
               onerror="handlePetImgError(this)" 
               style="width:100%;height:100%;object-fit:cover;display:block;">
        </div>

        <!-- Avatar do Usuário -->
        <div style="width:116px;height:116px;border-radius:50%;border:4px solid white;box-shadow:0 12px 28px rgba(0,0,0,0.25);overflow:hidden;background:#FF8C5A;margin-left:-32px;z-index:1;position:relative;flex-shrink:0;">
          <img id="matchUserImg" 
               src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&q=80" 
               onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&q=80';" 
               style="width:100%;height:100%;object-fit:cover;display:block;">
        </div>

        <!-- Coração animado central -->
        <div style="position:absolute;bottom:-12px;left:50%;width:38px;height:38px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;animation:heartBeat 1.5s infinite;box-shadow:0 4px 14px rgba(0,0,0,0.2);z-index:3;">❤️</div>
      </div>

      <!-- Botões de Ação -->
      <button type="button" onclick="goToChat()" class="btn" style="background:white;color:var(--primary);font-weight:800;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,0.18);width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;padding:15px;border-radius:14px;transition:transform 0.2s, box-shadow 0.2s;">
        <span>💬</span> Mandar mensagem
      </button>

      <a href="05-home-swipe.html" class="btn" style="background:transparent;color:white;border:2px solid rgba(255,255,255,0.7);margin-top:12px;font-weight:700;width:100%;text-decoration:none;display:flex;align-items:center;justify-content:center;padding:13px;border-radius:14px;box-sizing:border-box;">
        Continuar vendo pets
      </a>
    </div>
  </div>
</div>

<script src="db.js"></script>
<script>
// Imagens verificadas e seguras
const KNOWN_SAFE_PETS = {
  "1": "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=800&q=80", // Buddy
  "2": "https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=800&q=80", // Luna
  "3": "https://images.unsplash.com/photo-1592194996308-7b43878e84a6?w=800&q=80", // Mia
  "4": "https://images.unsplash.com/photo-1561037404-61cd46aa615b?w=800&q=80", // Thor (Pastor Alemão)
  "5": "https://images.unsplash.com/photo-1516371535707-512a1e83bb9a?w=800&q=80", // Bella (Poodle)
  "6": "https://images.unsplash.com/photo-1605568427561-40dd23c2acea?w=800&q=80", // Zeus (Husky)
  "7": "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=800&q=80", // Nala (Gato)
  "8": "https://images.unsplash.com/photo-1505628346881-b72b27e84530?w=800&q=80", // Max (Beagle)
  "9": "https://images.unsplash.com/photo-1513360371669-4adf3dd7dff8?w=800&q=80", // Nina (Gato)
  "10": "https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?w=800&q=80" // Rocky
};

const DEFAULT_FALLBACK_IMG = "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=800&q=80";

function handlePetImgError(imgEl) {
  imgEl.onerror = null;
  const pId = String(urlParams.get('petId') || localStorage.getItem('lastPetId') || '');
  if (pId && KNOWN_SAFE_PETS[pId]) {
    imgEl.src = KNOWN_SAFE_PETS[pId];
  } else {
    imgEl.src = DEFAULT_FALLBACK_IMG;
  }
}

// Sanitiza URLs antigas que davam 404
function sanitizePetUrl(url, pId) {
  if (!url || url.includes('1589966847426') || url.includes('1590634331661') || url.includes('1537151608804')) {
    if (pId && KNOWN_SAFE_PETS[String(pId)]) return KNOWN_SAFE_PETS[String(pId)];
    return DEFAULT_FALLBACK_IMG;
  }
  return url;
}

const urlParams = new URLSearchParams(window.location.search);
let matchId = urlParams.get('matchId') || localStorage.getItem('lastMatchId');
let petId = urlParams.get('petId') || localStorage.getItem('lastPetId');

// Som comemorativo com Web Audio API
function playMatchCelebration() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99, 1046.50]; // Acorde Maior de Vitória C5, E5, G5, C6
    notes.forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
      gain.gain.setValueAtTime(0.18, ctx.currentTime + idx * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + idx * 0.08);
      osc.stop(ctx.currentTime + idx * 0.08 + 0.35);
    });
  } catch(e) {}
}

// Animação de entrada rápida e suave
setTimeout(() => {
  const mc = document.getElementById('matchContent');
  if(mc) { 
    mc.style.opacity = '1'; 
    mc.style.transform = 'scale(1)'; 
  }
  playMatchCelebration();
}, 60);

// Carregamento síncrono inicial com cache local (sem tela branca)
function loadInitialCache() {
  const cachedName = localStorage.getItem('lastPetName');
  let cachedImg = localStorage.getItem('lastPetImg');
  cachedImg = sanitizePetUrl(cachedImg, petId);

  if (cachedName) {
    document.getElementById('matchSubText').innerText = `Você e ${cachedName} se conectaram!`;
  }
  if (cachedImg) {
    document.getElementById('matchPetImg').src = cachedImg;
  } else if (petId && KNOWN_SAFE_PETS[String(petId)]) {
    document.getElementById('matchPetImg').src = KNOWN_SAFE_PETS[String(petId)];
  }

  // Foto do usuário logado (se houver no localStorage)
  const userPhoto = localStorage.getItem('userAvatar') || localStorage.getItem('userPhoto');
  if (userPhoto) {
    document.getElementById('matchUserImg').src = userPhoto;
  }
}
loadInitialCache();

// Sincronização e enriquecimento de dados via Cloud DB
async function initMatchDisplay() {
  try {
    const db = await loadDb();
    let pet = null;
    let match = null;

    if (petId) {
      pet = (db.pets || []).find(p => String(p.id) === String(petId));
    }
    if (matchId) {
      match = (db.matches || []).find(x => String(x.id) === String(matchId));
      if (!pet && match) {
        pet = (db.pets || []).find(p => String(p.id) === String(match.petId));
      }
    }

    if (pet) {
      document.getElementById('matchSubText').innerText = `Você e ${pet.name} se conectaram!`;
      
      const safeImg = sanitizePetUrl(pet.img, pet.id);
      document.getElementById('matchPetImg').src = safeImg;
      
      if (pet.breed && pet.ong) {
        document.getElementById('matchPetTag').innerText = `${pet.breed} • ${pet.ong}`;
      } else if (pet.breed) {
        document.getElementById('matchPetTag').innerText = `${pet.breed}`;
      }

      localStorage.setItem('lastPetName', pet.name);
      localStorage.setItem('lastPetImg', safeImg);
      localStorage.setItem('lastPetId', String(pet.id));
    } else if (match) {
      document.getElementById('matchSubText').innerText = `Você e ${match.petName} se conectaram!`;
      const safeImg = sanitizePetUrl(match.petImg, match.petId);
      document.getElementById('matchPetImg').src = safeImg;
    }
  } catch(e) {
    console.warn("Erro ao enriquecer dados do match:", e);
  }
}
initMatchDisplay();

// Efeito Confete Colorido
const colors = ['#ffffff', '#FFD700', '#FF8C00', '#FFF9C4', '#FFE082', '#06D6A0'];
const container = document.getElementById('confetti');
for(let i = 0; i < 50; i++){
  setTimeout(() => {
    const el = document.createElement('div');
    const size = Math.random() * 8 + 6;
    el.style.cssText = `position:absolute;width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};left:${Math.random()*100}%;top:-15px;border-radius:${Math.random()>.5?'50%':'2px'};animation:confettiFall ${Math.random()*2+2}s ${Math.random()*0.5}s linear forwards;`;
    container.appendChild(el);
  }, i * 35);
}

// Navegação direta e rápida para o Chat
function goToChat() {
  const mId = matchId || localStorage.getItem('lastMatchId');
  const pId = petId || localStorage.getItem('lastPetId');
  let target = '10-chat-mensagem.html';
  if (mId) {
    target += '?matchId=' + encodeURIComponent(mId);
    if (pId) target += '&petId=' + encodeURIComponent(pId);
  } else if (pId) {
    target += '?petId=' + encodeURIComponent(pId);
  }
  window.location.href = target;
}
</script>
</body>
</html>
