<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Cadastrar Pet · Patinhas</title>
  <link rel="stylesheet" href="styles.css">
  
</head>
<body>

<div class="phone">
  <div class="statusbar" style="color:var(--text-1);">
  <span class="time">9:41</span>
  <div class="icons">
    <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="4" width="3" height="8" rx="1"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1"/><rect x="9" y="0.5" width="3" height="11.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".3"/></svg>
    <svg width="15" height="12" viewBox="0 0 15 12" fill="currentColor"><path d="M7.5 2.5C9.8 2.5 11.8 3.5 13.2 5L14.5 3.7C12.8 1.9 10.3 0.8 7.5 0.8S2.2 1.9 0.5 3.7L1.8 5C3.2 3.5 5.2 2.5 7.5 2.5Z" opacity=".3"/><path d="M7.5 5.2C9.0 5.2 10.4 5.9 11.4 7L12.7 5.7C11.4 4.3 9.6 3.5 7.5 3.5S3.6 4.3 2.3 5.7L3.6 7C4.6 5.9 6.0 5.2 7.5 5.2Z" opacity=".6"/><circle cx="7.5" cy="10" r="2"/></svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="21" height="10" rx="3" stroke="currentColor" stroke-width="1" fill="none" opacity=".35"/><rect x="1.5" y="2.5" width="15" height="7" rx="2"/><path d="M22 4.5v3a1.5 1.5 0 000-3z" opacity=".4"/></svg>
  </div>
</div>
  <div style="padding:0 20px 16px;display:flex;align-items:center;gap:12px;">
    <a href="14-meus-anuncios.html" style="display:flex;align-items:center;color:var(--text-1);text-decoration:none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
    </a>
    <h1 style="font-size:18px;font-weight:700;">Cadastrar Pet</h1>
  </div>

  <div class="scroll-content" style="padding:0 20px 20px;">
    <!-- Photo upload -->
    <div style="display:flex;gap:10px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px;">
      <div onclick="this.style.borderColor='var(--primary)';this.style.background='rgba(255,107,53,0.05)'" style="width:100px;height:100px;border-radius:var(--radius-md);border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;flex-shrink:0;background:var(--surface-2);transition:all 0.2s;">
        <span style="font-size:24px;">📷</span>
        <span style="font-size:10px;color:var(--text-3);font-weight:500;">Foto principal</span>
      </div>
      <div style="width:100px;height:100px;border-radius:var(--radius-md);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;background:var(--surface-2);font-size:24px;">+</div>
      <div style="width:100px;height:100px;border-radius:var(--radius-md);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;background:var(--surface-2);font-size:24px;">+</div>
    </div>

    <div class="input-group">
      <label>Nome do pet</label>
      <div class="input-wrap"><span class="input-icon">🐾</span><input type="text" placeholder="Ex: Bolinha"></div>
    </div>
    <div style="display:flex;gap:10px;">
      <div class="input-group" style="flex:1;">
        <label>Espécie</label>
        <div class="input-wrap"><span class="input-icon">🐶</span>
          <select>
            <option>Cão</option>
            <option>Gato</option>
            <option>Outro</option>
          </select>
        </div>
      </div>
      <div class="input-group" style="flex:1;">
        <label>Sexo</label>
        <div class="input-wrap"><span class="input-icon">⚥</span>
          <select><option>Macho</option><option>Fêmea</option></select>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:10px;">
      <div class="input-group" style="flex:1;">
        <label>Porte</label>
        <div class="input-wrap"><span class="input-icon">📏</span>
          <select><option>Pequeno</option><option>Médio</option><option>Grande</option></select>
        </div>
      </div>
      <div class="input-group" style="flex:1;">
        <label>Idade</label>
        <div class="input-wrap"><span class="input-icon">📅</span>
          <input type="text" placeholder="Ex: 2 anos">
        </div>
      </div>
    </div>
    <div class="input-group">
      <label>Raça</label>
      <div class="input-wrap"><span class="input-icon">🔬</span><input type="text" placeholder="SRD (vira-lata) ou raça específica"></div>
    </div>
    <div class="input-group">
      <label>Sobre o pet</label>
      <textarea rows="3" placeholder="Conte um pouco sobre a personalidade e história do pet..." style="width:100%;padding:15px 16px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:'Inter',sans-serif;resize:none;box-sizing:border-box;"></textarea>
    </div>
    <!-- Checkboxes -->
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;">
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;cursor:pointer;background:var(--surface-2);padding:8px 14px;border-radius:20px;"><input type="checkbox" style="accent-color:var(--primary);"> Vacinado</label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;cursor:pointer;background:var(--surface-2);padding:8px 14px;border-radius:20px;"><input type="checkbox" style="accent-color:var(--primary);"> Castrado</label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;cursor:pointer;background:var(--surface-2);padding:8px 14px;border-radius:20px;"><input type="checkbox" style="accent-color:var(--primary);"> Vermifugado</label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;cursor:pointer;background:var(--surface-2);padding:8px 14px;border-radius:20px;"><input type="checkbox" style="accent-color:var(--primary);"> Sociável</label>
    </div>

    <a href="14-meus-anuncios.html" class="btn btn-primary">Publicar Anúncio</a>
  </div>
</div>


</body>
</html>
