<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Painel ONG · Patinhas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="phone">
  <!-- Header vermelho -->
  <div style="background:var(--primary);padding:44px 20px 24px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <div>
        <p style="color:rgba(255,255,255,0.7);font-size:12px;margin-bottom:2px;">Bem-vinda,</p>
        <h1 style="color:white;font-size:20px;font-weight:800;">ONG Patinhas 🏥</h1>
      </div>
      <div style="width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:18px;">🔔</div>
    </div>
    <!-- Stats -->
    <div style="display:flex;gap:10px;">
      <div style="flex:1;background:rgba(255,255,255,0.18);border-radius:var(--radius-sm);padding:12px;">
        <div id="stat-pets" style="font-size:24px;font-weight:900;color:white;">-</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.7);">Pets ativos</div>
      </div>
      <div style="flex:1;background:rgba(0,0,0,0.15);border-radius:var(--radius-sm);padding:12px;">
        <div id="stat-pendentes" style="font-size:24px;font-weight:900;color:white;">-</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.7);">Candidatos</div>
      </div>
      <div style="flex:1;background:rgba(255,255,255,0.18);border-radius:var(--radius-sm);padding:12px;">
        <div id="stat-aprovados" style="font-size:24px;font-weight:900;color:white;">-</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.7);">Adoções</div>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div style="display:flex;background:var(--surface);border-bottom:1px solid var(--border);">
    <button onclick="showTab('pending')" id="tab-pending" style="flex:1;padding:13px;border:none;font-size:13px;font-weight:700;color:var(--primary);border-bottom:2px solid var(--primary);background:none;cursor:pointer;">Candidatos (3)</button>
    <button onclick="showTab('pets')" id="tab-pets" style="flex:1;padding:13px;border:none;font-size:13px;font-weight:600;color:var(--text-3);border-bottom:2px solid transparent;background:none;cursor:pointer;">Pets</button>
    <button onclick="showTab('done')" id="tab-done" style="flex:1;padding:13px;border:none;font-size:13px;font-weight:600;color:var(--text-3);border-bottom:2px solid transparent;background:none;cursor:pointer;">Concluídos</button>
  </div>

  <div class="scroll-content" style="padding:16px 20px;">
    <div id="list-pending">
      <p style="text-align:center;color:var(--text-3);padding:30px;">Carregando candidatos...</p>
    </div>

    <div id="list-pets" style="display:none;">
      <a href="13-criar-anuncio.html" class="btn btn-outline" style="margin-bottom:14px;display:block;text-align:center;text-decoration:none;">+ Cadastrar novo pet</a>
      <div id="petsContainer"></div>
    </div>

    <div id="list-done" style="display:none;padding:16px 0;">
      <div style="text-align:center;margin-bottom:20px;">
        <div style="font-size:48px;margin-bottom:8px;">🏆</div>
        <div id="doneCountText" style="font-size:32px;font-weight:900;color:var(--primary);">0</div>
        <div style="font-size:14px;color:var(--text-2);margin-top:4px;">adoções concluídas!</div>
      </div>
      <div id="doneContainer"></div>
    </div>
  </div>

  <div style="padding:8px 20px 12px;border-top:1px solid var(--border);">
    <a href="01-login.html" class="btn btn-ghost" style="padding:12px;font-size:13px;display:block;text-align:center;text-decoration:none;">Sair do painel</a>
  </div>
</div>

<script src="db.js"></script>
<script>
let appDb = null;

async function loadDashboard() {
    try {
        appDb = await loadDb();
        const pets = appDb.pets || [];
        const matches = appDb.matches || [];
        
        const pendentes = matches.filter(m => m.status === 'pendente');
        const aprovados = matches.filter(m => m.status === 'aprovado');
        const ativos = pets.filter(p => p.status === 'disponivel');
        
        document.getElementById('stat-pets').textContent = ativos.length;
        document.getElementById('stat-pendentes').textContent = pendentes.length;
        document.getElementById('stat-aprovados').textContent = aprovados.length;
        document.getElementById('tab-pending').textContent = `Candidatos (${pendentes.length})`;
        
        // Candidatos Pendentes
        const listPending = document.getElementById('list-pending');
        listPending.innerHTML = '';
        if(pendentes.length === 0) {
            listPending.innerHTML = '<div style="text-align:center;color:var(--text-3);padding:40px 20px;"><div style="font-size:36px;margin-bottom:8px;">🤝</div><p style="font-size:14px;">Nenhum candidato pendente no momento.</p></div>';
        } else {
            pendentes.slice().reverse().forEach(m => {
                let badge = '<span class="chip" style="background:#fff3cd;color:#856404;font-size:11px;">Pendente</span>';
                if(m.status === 'termo_assinado') {
                    badge = '<span class="chip" style="background:#d1fae5;color:#065f46;font-size:11px;">✍️ Termo Assinado</span>';
                } else if(m.status === 'termo_enviado') {
                    badge = '<span class="chip" style="background:#ede9fe;color:#5b21b6;font-size:11px;">📋 Termo Enviado</span>';
                }
                listPending.innerHTML += `
                <div class="card" style="padding:16px;margin-bottom:12px;" id="c-${m.id}">
                    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
                        <img src="${m.petImg}" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=200&q=80';" style="width:50px;height:50px;border-radius:10px;object-fit:cover;">
                        <div style="flex:1;">
                            <div style="font-weight:700;font-size:15px;">${m.userName}</div>
                            <div style="font-size:12px;color:var(--text-2);">Quer adotar: <strong>${m.petName}</strong></div>
                        </div>
                        ${badge}
                    </div>
                    <div style="display:flex;gap:8px;">
                        <button class="btn btn-outline" onclick="enviarTermo('${m.id}')" style="padding:10px;font-size:12px;flex:1.2;background:#FAF5FF;border-color:#D8B4FE;color:#6B21A8;font-weight:700;">📋 Termo</button>
                        <button class="btn btn-primary" onclick="setStatus('${m.id}', 'aprovado')" style="padding:10px;font-size:12px;flex:1;">✓ Aprovar</button>
                        <button class="btn btn-outline" onclick="setStatus('${m.id}', 'rejeitado')" style="padding:10px;font-size:12px;flex:1;">✕ Rejeitar</button>
                        <a href="10-chat-mensagem.html?matchId=${m.id}" style="width:42px;height:42px;border-radius:var(--radius-sm);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:18px;text-decoration:none;flex-shrink:0;">💬</a>
                    </div>
                </div>`;
            });
        }

        // Pets
        const pCont = document.getElementById('petsContainer');
        pCont.innerHTML = '';
        pets.forEach(p => {
            const isAdotado = p.status === 'adotado';
            pCont.innerHTML += `
            <div class="card" style="display:flex;gap:12px;padding:14px;margin-bottom:10px;align-items:center;${isAdotado ? 'opacity:0.6;' : ''}">
                <img src="${p.img}" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=200&q=80';" style="width:64px;height:64px;border-radius:var(--radius-sm);object-fit:cover;flex-shrink:0;">
                <div style="flex:1;">
                    <h3 style="font-size:15px;font-weight:700;margin-bottom:4px;">${p.name}</h3>
                    <p style="font-size:12px;color:var(--text-2);margin-bottom:6px;">${p.breed} • ${p.age}</p>
                    <span class="chip ${isAdotado ? '' : 'chip-success'}" style="${isAdotado ? 'background:#e2e8f0;color:#475569;' : ''}">${isAdotado ? 'Adotado' : 'Disponível'}</span>
                </div>
            </div>`;
        });

        // Concluídos (Adoções aprovadas)
        document.getElementById('doneCountText').innerText = aprovados.length;
        const dCont = document.getElementById('doneContainer');
        dCont.innerHTML = '';
        if(aprovados.length === 0) {
            dCont.innerHTML = '<p style="text-align:center;color:var(--text-3);font-size:13px;">Nenhuma adoção concluída ainda.</p>';
        } else {
            aprovados.forEach(m => {
                dCont.innerHTML += `
                <div class="card" style="display:flex;gap:12px;padding:14px;margin-bottom:10px;align-items:center;background:#F0FDF4;border:1px solid #BBF7D0;">
                    <img src="${m.petImg}" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=200&q=80';" style="width:50px;height:50px;border-radius:10px;object-fit:cover;">
                    <div style="flex:1;">
                        <div style="font-weight:700;font-size:14px;color:#15803D;">${m.petName} adotado(a)! 🎉</div>
                        <div style="font-size:12px;color:#166534;">Adotante: <strong>${m.userName}</strong></div>
                    </div>
                </div>`;
            });
        }
    } catch(e) { console.error(e); }
}

async function enviarTermo(matchId) {
    if(!confirm("Deseja enviar o Termo de Adoção Responsável para o candidato no chat?")) return;
    try {
        if(!appDb) appDb = await loadDb();
        const m = (appDb.matches || []).find(x => x.id == matchId);
        if(m) {
            m.status = 'termo_enviado';
            m.termoEnviado = true;
            m.termoEnviadoEm = new Date().toISOString();
            
            const time = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
            if(!appDb.chats) appDb.chats = [];
            appDb.chats.push({
                matchId: matchId,
                sender: 'ong',
                text: `Olá, ${m.userName}! Disponibilizamos o Termo Oficial de Adoção para o(a) ${m.petName}. Por favor, acesse o link abaixo para ler e assinar digitalmente! 🐾📋`,
                time: time
            });
            appDb.chats.push({
                matchId: matchId,
                sender: 'ong',
                text: `📄 [TERMO DE ADOÇÃO RESPONSÁVEL]\nClique no botão abaixo para ler o contrato e realizar a assinatura digital para adoção de ${m.petName}.`,
                isTermo: true,
                petId: m.petId,
                petName: m.petName,
                petImg: m.petImg,
                time: time
            });
            await saveDb(appDb);
            await loadDashboard();
            alert("Termo de adoção enviado com sucesso! 📋");
        }
    } catch(e) { console.error(e); alert("Erro ao enviar termo."); }
}

async function setStatus(matchId, status) {
    try {
        if(!appDb) appDb = await loadDb();
        const m = (appDb.matches || []).find(x => x.id == matchId);
        if(m) {
            m.status = status;
            if(status === 'aprovado') {
                const pet = (appDb.pets || []).find(p => p.id == m.petId);
                if(pet) pet.status = 'adotado';
            }
            await saveDb(appDb);
            await loadDashboard();
            if(status === 'aprovado') alert(`Adoção de ${m.petName} aprovada com sucesso! 🎉`);
        }
    } catch(e) { console.error(e); }
}

function showTab(tab) {
  ['pending','pets','done'].forEach(t => {
    const l = document.getElementById('list-'+t);
    if(l) l.style.display = t === tab ? 'block' : 'none';
    const b = document.getElementById('tab-'+t);
    if(b) {
      b.style.color = t === tab ? 'var(--primary)' : 'var(--text-3)';
      b.style.borderBottom = t === tab ? '2px solid var(--primary)' : '2px solid transparent';
      b.style.fontWeight = t === tab ? '700' : '600';
    }
  });
}

loadDashboard();
setInterval(loadDashboard, 4000);

</script>
</body>
</html>
