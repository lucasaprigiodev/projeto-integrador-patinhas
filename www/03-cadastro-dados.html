<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Seus dados · Patinhas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="phone">
  <div class="statusbar" style="color:var(--text-1);">
    <span class="time">9:41</span>
    <div class="icons">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="4" width="3" height="8" rx="1"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1"/><rect x="9" y="0.5" width="3" height="11.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".3"/></svg>
      <svg width="15" height="12" viewBox="0 0 15 12" fill="currentColor"><path d="M7.5 2.5C9.8 2.5 11.8 3.5 13.2 5L14.5 3.7C12.8 1.9 10.3 0.8 7.5 0.8S2.2 1.9 0.5 3.7L1.8 5C3.2 3.5 5.2 2.5 7.5 2.5Z" opacity=".3"/><path d="M7.5 5.2C9.0 5.2 10.4 5.9 11.4 7L12.7 5.7C11.4 4.3 9.6 3.5 7.5 3.5S3.6 4.3 2.3 5.7L3.6 7C4.6 5.9 6.0 5.2 7.5 5.2Z" opacity=".6"/><circle cx="7.5" cy="10" r="2"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="21" height="10" rx="3" stroke="currentColor" stroke-width="1" fill="none" opacity=".35"/><rect x="1.5" y="2.5" width="15" height="7" rx="2"/><path d="M22 4.5v3a1.5 1.5 0 000-3z" opacity=".4"/></svg>
    </div>
  </div>
  <div class="scroll-content" style="padding:24px;">
    <a href="02-cadastro-tipo.html" style="display:inline-flex;align-items:center;gap:8px;color:var(--text-2);text-decoration:none;font-size:14px;font-weight:500;margin-bottom:24px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
      Voltar
    </a>

    <p style="font-size:13px;color:var(--primary);font-weight:600;margin-bottom:8px;">PASSO 2 DE 2</p>
    <div class="step-bar"><div class="step done"></div><div class="step done"></div></div>

    <h2 class="section-title" style="font-size:24px;">Criar Conta</h2>
    <p id="perfil-label" class="section-sub">Seus dados serão salvos com segurança no banco de dados SQLite.</p>

    <div id="reg-feedback" style="display:none; padding:12px 14px; border-radius:12px; font-size:13px; font-weight:600; margin-bottom:16px; line-height:1.4;"></div>

    <div class="input-group">
      <label>Nome Completo</label>
      <div class="input-wrap"><span class="input-icon">👤</span><input type="text" id="reg-nome" placeholder="João da Silva"></div>
    </div>
    <div class="input-group">
      <label>CPF / CNPJ</label>
      <div class="input-wrap"><span class="input-icon">🪪</span><input type="text" id="reg-cpf" placeholder="000.000.000-00"></div>
    </div>
    <div class="input-group">
      <label>WhatsApp</label>
      <div class="input-wrap"><span class="input-icon">📱</span><input type="tel" id="reg-tel" placeholder="(84) 99999-9999"></div>
    </div>
    <div class="input-group">
      <label>E-mail</label>
      <div class="input-wrap"><span class="input-icon">✉️</span><input type="email" id="reg-email" placeholder="joao@email.com"></div>
    </div>
    <div class="input-group">
      <label>Senha</label>
      <div class="input-wrap"><span class="input-icon">🔒</span><input type="password" id="reg-senha" placeholder="Mínimo 4 caracteres"></div>
    </div>

    <button id="btn-registrar" class="btn btn-primary" style="margin-top:8px;" onclick="registrarUsuario()">
      Criar minha conta 🎉
    </button>
  </div>
</div>

<script src="db.js"></script>
<script>
const perfilEscolhido = localStorage.getItem('cadastro_perfil') || 'adotante';
document.getElementById('perfil-label').textContent =
  perfilEscolhido === 'ong'
    ? 'Cadastro de Perfil Institucional: ONG / Protetor'
    : 'Cadastro de Perfil: Candidato Adotante';

function showRegFeedback(type, msg) {
  const box = document.getElementById('reg-feedback');
  box.style.display = 'block';
  if (type === 'loading') {
    box.style.background = '#EFF6FF';
    box.style.color = '#1D4ED8';
    box.style.border = '1px solid #BFDBFE';
  } else if (type === 'error') {
    box.style.background = '#FEF2F2';
    box.style.color = '#DC2626';
    box.style.border = '1px solid #FECACA';
  } else if (type === 'success') {
    box.style.background = '#ECFDF5';
    box.style.color = '#047857';
    box.style.border = '1px solid #A7F3D0';
  }
  box.textContent = msg;
}

async function registrarUsuario() {
  const nome = (document.getElementById('reg-nome').value || '').trim();
  const cpf = (document.getElementById('reg-cpf').value || '').trim();
  const telefone = (document.getElementById('reg-tel').value || '').trim();
  const email = (document.getElementById('reg-email').value || '').trim();
  const senha = (document.getElementById('reg-senha').value || '').trim();
  const btn = document.getElementById('btn-registrar');

  if (nome.length < 3) {
    showRegFeedback('error', '⚠️ Informe seu nome completo (mínimo 3 caracteres).');
    return;
  }
  if (!email.includes('@')) {
    showRegFeedback('error', '⚠️ Informe um endereço de e-mail válido.');
    return;
  }
  if (senha.length < 4) {
    showRegFeedback('error', '⚠️ A senha deve conter no mínimo 4 caracteres.');
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ Salvando no servidor...';
  showRegFeedback('loading', '⏳ Enviando dados para a API REST (POST /api/auth/register)...');

  try {
    const res = await PatinhasAPI.register({
      nome,
      cpf,
      telefone,
      email,
      senha,
      perfil: perfilEscolhido
    });

    showRegFeedback('success', `✅ Conta criada no servidor SQLite (ID ${res.usuario.id})! Redirecionando...`);
    btn.textContent = '✅ Conta Criada!';

    setTimeout(() => {
      window.location.href = res.usuario.perfil === 'ong' ? '15-painel-ong.html' : '05-home-swipe.html';
    }, 600);
  } catch (err) {
    if (err.status === 400 || err.status === 409) {
      btn.disabled = false;
      btn.textContent = 'Criar minha conta 🎉';
      showRegFeedback('error', `⚠️ ${err.message}`);
      return;
    }

    // Fallback local caso o servidor local não esteja ativo
    const localUsers = JSON.parse(localStorage.getItem('local_registered_users') || '[]');
    const newUser = { id: Date.now(), nome, cpf, telefone, email, senha, perfil: perfilEscolhido };
    localUsers.push(newUser);
    localStorage.setItem('local_registered_users', JSON.stringify(localUsers));
    PatinhasAPI.setAuthSession('offline-jwt-' + newUser.id, newUser);
    showRegFeedback('success', '✅ Cadastro confirmado! Redirecionando...');
    setTimeout(() => {
      window.location.href = perfilEscolhido === 'ong' ? '15-painel-ong.html' : '05-home-swipe.html';
    }, 500);
  }
}
</script>
</body>
</html>
