<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Período de Teste · Patinhas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="phone">
  <div class="statusbar" style="color:var(--text-1);">
    <span class="time">9:41</span>
    <div class="icons">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="4" width="3" height="8" rx="1"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1"/><rect x="9" y="0.5" width="3" height="11.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".3"/></svg>
      <svg width="15" height="12" viewBox="0 0 15 12" fill="currentColor"><path d="M7.5 2.5C9.8 2.5 11.8 3.5 13.2 5L14.5 3.7C12.8 1.9 10.3 0.8 7.5 0.8S2.2 1.9 0.5 3.7L1.8 5C3.2 3.5 5.2 2.5 7.5 2.5Z" opacity=".3"/><path d="M7.5 5.2C9.0 5.2 10.4 5.9 11.4 7L12.7 5.7C11.4 4.3 9.6 3.5 7.5 3.5S3.6 4.3 2.3 5.7L3.6 7C4.6 5.9 6.0 5.2 7.5 5.2Z" opacity=".6"/><circle cx="7.5" cy="10" r="2"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="21" height="10" rx="3" stroke="currentColor" stroke-width="1" fill="none" opacity=".35"/><rect x="1.5" y="2.5" width="15" height="7" rx="2"/><path d="M22 4.5v3a1.5 1.5 0 000-3z" opacity=".4"/></svg>
    </div>
  </div>
  <div style="padding:0 20px;display:flex;align-items:center;gap:12px;margin-bottom:8px;">
    <a href="javascript:history.back()" style="display:flex;align-items:center;color:var(--text-1);text-decoration:none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
    </a>
    <h1 style="font-size:18px;font-weight:700;">Período de Adaptação</h1>
  </div>

  <div class="scroll-content" style="padding:0 20px 20px;text-align:center;">
    <!-- Timer -->
    <div style="position:relative;width:180px;height:180px;margin:24px auto;">
      <svg viewBox="0 0 180 180" style="width:100%;height:100%;transform:rotate(-90deg);">
        <circle cx="90" cy="90" r="80" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
        <circle cx="90" cy="90" r="80" fill="none" stroke="url(#grad)" stroke-width="12" stroke-dasharray="502" stroke-dashoffset="150" stroke-linecap="round"/>
        <defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#FF6B35"/></linearGradient></defs>
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;">
        <span id="dias" style="font-size:48px;font-weight:900;color:var(--primary);letter-spacing:-2px;line-height:1;">7</span>
        <span style="font-size:12px;font-weight:700;color:var(--text-2);letter-spacing:1px;">DIAS RESTANTES</span>
      </div>
    </div>

    <!-- Pet -->
    <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:24px;background:var(--surface-2);padding:12px 18px;border-radius:16px;max-width:280px;margin-left:auto;margin-right:auto;">
      <img id="acompPetImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23EDE9FE' width='100' height='100'/%3E%3Ctext y='55%25' x='50%25' text-anchor='middle' dy='.1em' font-size='40'%3E🐾%3C/text%3E%3C/svg%3E" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=400&q=80';" style="width:48px;height:48px;border-radius:12px;object-fit:cover;">
      <script>
        (function() {
          try {
            const cImg = localStorage.getItem('lastPetImg');
            if (cImg) document.getElementById('acompPetImg').src = cImg;
            const cName = localStorage.getItem('lastPetName');
            if (cName) document.getElementById('acompPetName').innerText = cName;
          } catch(_) {}
        })();
      </script>
      <div style="text-align:left;">
        <div id="acompPetName" style="font-weight:800;font-size:16px;color:var(--text-1);">Pet</div>
        <div id="acompPetDate" style="font-size:12px;color:var(--text-2);">Termo Assinado</div>
      </div>
    </div>

    <!-- Progress -->
    <div style="background:var(--surface-2);border-radius:var(--radius-md);padding:18px;margin-bottom:20px;text-align:left;border:1px solid var(--border);">
      <h3 style="font-size:14px;font-weight:700;margin-bottom:14px;color:var(--text-1);">Linha do tempo da adoção</h3>
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div style="display:flex;gap:12px;align-items:center;">
          <div style="width:28px;height:28px;border-radius:50%;background:var(--success);color:white;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;">✓</div>
          <div><div style="font-size:13px;font-weight:700;color:var(--text-1);">Termo de Adoção Assinado</div><div id="dataTermoAssinado" style="font-size:11px;color:var(--text-3);">Hoje</div></div>
        </div>
        <div style="display:flex;gap:12px;align-items:center;">
          <div style="width:28px;height:28px;border-radius:50%;background:#7C3AED;color:white;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;">◉</div>
          <div><div style="font-size:13px;font-weight:700;color:var(--text-1);">Período de adaptação</div><div style="font-size:11px;color:#7C3AED;font-weight:600;">Em andamento (7 dias)</div></div>
        </div>
        <div style="display:flex;gap:12px;align-items:center;opacity:0.45;">
          <div style="width:28px;height:28px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;">○</div>
          <div><div style="font-size:13px;font-weight:600;color:var(--text-1);">Adoção definitiva concluída</div><div id="dataPrevisao" style="font-size:11px;color:var(--text-3);">Em 7 dias</div></div>
        </div>
      </div>
    </div>

    <a href="05-home-swipe.html" class="btn btn-primary" style="background:#7C3AED;border:none;">🎉 Adoção em Andamento!</a>
    <a id="btnChatAjuda" href="10-chat-mensagem.html" class="btn btn-outline" style="margin-top:8px;">Falar com a ONG no Chat</a>
  </div>
</div>

<script src="db.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
let matchId = urlParams.get('matchId') || localStorage.getItem('lastMatchId');
let petId = urlParams.get('petId') || localStorage.getItem('lastPetId');

async function initAcompanhamento() {
    try {
        const json = await loadDb();
        let match = null;
        if(matchId) match = (json.matches || []).find(m => m.id == matchId);
        if(!match && petId) match = (json.matches || []).find(m => String(m.petId) === String(petId));
        if(!match && (json.matches || []).length > 0) match = json.matches[json.matches.length - 1];

        const resolvedPetId = match ? match.petId : petId;
        const pet = (json.pets || []).find(p => p.id == resolvedPetId);

        const name = match ? match.petName : (pet ? pet.name : 'Pet');
        const img = match ? match.petImg : (pet ? pet.img : '');

        if(name) document.getElementById('acompPetName').innerText = name;
        if(img) document.getElementById('acompPetImg').src = img;

        const hoje = new Date();
        const dateStr = hoje.toLocaleDateString('pt-BR');
        document.getElementById('dataTermoAssinado').innerText = dateStr;
        document.getElementById('acompPetDate').innerText = `Termo assinado em ${dateStr}`;

        const previsao = new Date(hoje.getTime() + (7 * 24 * 60 * 60 * 1000));
        document.getElementById('dataPrevisao').innerText = previsao.toLocaleDateString('pt-BR');

        if(match) {
            document.getElementById('btnChatAjuda').href = `10-chat-mensagem.html?matchId=${match.id}&petId=${match.petId}`;
        }
    } catch(e) {
        console.error(e);
    }
}
initAcompanhamento();
</script>
</body>
</html>
