<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Login · Patinhas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="phone">
  <div style="height:100%; display:flex; flex-direction:column; background:white;">
    <div class="statusbar" style="color:var(--text-1);">
  <span class="time">9:41</span>
  <div class="icons">
    <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="4" width="3" height="8" rx="1"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1"/><rect x="9" y="0.5" width="3" height="11.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".3"/></svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="21" height="10" rx="3" stroke="currentColor" stroke-width="1" fill="none" opacity=".35"/><rect x="1.5" y="2.5" width="15" height="7" rx="2"/><path d="M22 4.5v3a1.5 1.5 0 000-3z" opacity=".4"/></svg>
  </div>
</div>
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; padding:32px 28px;" class="anim-fade-up">

      <!-- Logo -->
      <div style="text-align:center; margin-bottom:36px;">
        <div style="width:80px;height:80px;background:var(--primary);border-radius:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 8px 24px rgba(255,90,95,0.35);font-size:38px;animation:pulse 2s infinite;">🐾</div>
        <h1 style="font-size:28px;font-weight:800;color:var(--text-1);letter-spacing:-0.8px;">Patinhas</h1>
        <p style="color:var(--text-2);font-size:14px;margin-top:6px;">Conectando corações e patinhas</p>
      </div>

      <!-- Inputs -->
      <div class="input-group">
        <label>E-mail</label>
        <div class="input-wrap">
          <span class="input-icon">✉️</span>
          <input type="email" id="email" placeholder="seu@email.com">
        </div>
      </div>
      <div class="input-group">
        <label>Senha</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="senha" placeholder="••••••••">
        </div>
      </div>
      <p style="text-align:right;margin:-10px 0 18px;font-size:13px;color:var(--primary);font-weight:600;cursor:pointer;">Esqueci a senha</p>

      <button class="btn btn-primary" onclick="fazerLogin()">Entrar</button>

      <div class="divider">ou</div>

      <button class="btn btn-ghost" onclick="window.location.href='05-home-swipe.html'">
        🌐 &nbsp;Entrar com Google
      </button>

      <p style="text-align:center;color:var(--text-2);font-size:14px;margin-top:28px;">
        Não tem conta? <a href="02-cadastro-tipo.html" style="color:var(--primary);font-weight:700;">Cadastre-se</a>
      </p>
    </div>
    <p style="text-align:center;color:var(--text-3);font-size:11px;padding-bottom:20px;">Admin: admin@ong.com / admin</p>
  </div>
</div>

<script>
function fazerLogin() {
  var e = document.getElementById('email').value;
  var s = document.getElementById('senha').value;
  if(e==='admin@ong.com' && s==='admin') localStorage.setItem('isONG','true');window.location.href='15-painel-ong.html';
  else localStorage.setItem('isONG','false');localStorage.setItem('userName', e.split('@')[0]||'Adotante');window.location.href='05-home-swipe.html';
}
document.addEventListener('keydown', e => { if(e.key==='Enter') fazerLogin(); });
</script>
</body>
</html>
